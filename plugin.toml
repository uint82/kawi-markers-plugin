name = "markers"
version = "0.1.2"
protocol = 1
runtime = "wasm"
description = "Highlight TODO markers, add gutter signs, and show marker counts"
component = "markers.wasm"
sha256 = "sha256:a6f62f425ba7992956bf3807157a39e37a0782ea55b87719793c83db224fb4f4"
timeout_ms = 5000
subscribes = ["buffer_changed", "buffer_opened", "file_opened", "file_saved", "buffer_closed"]

[debounce]
buffer_changed = 50

[capabilities]
"editor.read" = true
"editor.decorations" = true
"ui.message" = true
"ui.statusline" = true

[[decorations]]
id = "todo"
color = "info"
fill = "both"
italic = true

[[decorations]]
id = "todo_text"
color = "info"
fill = "foreground"
italic = true

[[decorations]]
id = "fixme"
color = "error"
fill = "both"
italic = true

[[decorations]]
id = "fixme_text"
color = "error"
fill = "foreground"
italic = true

[[decorations]]
id = "hack"
color = "warning"
fill = "both"
italic = true

[[decorations]]
id = "hack_text"
color = "warning"
fill = "foreground"
italic = true

[[decorations]]
id = "note"
color = "success"
fill = "both"
italic = true

[[decorations]]
id = "note_text"
color = "success"
fill = "foreground"
italic = true

[[decorations]]
id = "xxx"
color = "accent"
fill = "both"
italic = true

[[decorations]]
id = "xxx_text"
color = "accent"
fill = "foreground"
italic = true

[settings.show_signs]
type = "boolean"
default = true
description = "Show one gutter sign per line that contains a marker"

[settings.show_virtual_text]
type = "boolean"
default = true
description = "Show a marker summary after the first marker line"

[[activation_events]]
event = "on_startup"

[[activation_events]]
event = "on_command"

[[commands]]
id = "scan"
title = "Scan for TODO markers"
description = "Refresh marker highlights, gutter signs, and status line counts"
